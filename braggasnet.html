<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>braggas.net</title>
<style>
body {
  background-color: #FFFFFF;
  color: #000000;
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  padding: 0;
}

#topo {
  background-color: #C0C0C0;
  text-align: center;
  padding: 8px;
  border-bottom: 2px solid #000000;
}

#conteudo {

.icon {

  height: 90px;
  margin: 5px;

  vertical-align: top;
  background-color: #E0E0E0;
}

.icon img {
  width: 64px;
  height: 64px;
  margin-top: 5px;
}

#news {
  float: right;
  width: 200px;
  border: 1px solid #000000;
  padding: 5px;
  background-color: #F0F0F0;
  font-size: 12px;
}

a {
  color: #0000EE;
  text-decoration: underline;
}

a:hover {
  color: #FF0000;
}

footer {
  clear: both;
  text-align: center;
  font-size: 12px;
  padding: 8px;
  background-color: #C0C0C0;
  border-top: 2px solid #000000;
}
</style>
</head>
